<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="forest-bg">
    <div class="page-content">
    <header class="site-header">
        <h1>アースキー | AI薬剤師 × DAO</h1>
        <nav class="main-nav">
            <a href="https://earthkey-portfolio.vercel.app">Home</a>
            <a href="/about/">About</a>
            <a href="/gallery/">Gallery</a>
            <a href="/works/">Works</a>
            <a href="/blog/">Blog</a>
            <a href="/contact/">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <h2>Contact</h2>
            <p>お問い合わせ</p>
        </section>

        <section class="section container">
            <div class="card text-center">
                <p style="color: #64748B;">お問い合わせページは現在作成中です。</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p><a href="https://earthkey-portfolio.vercel.app/">Home</a> | © EarthKey | AI Pharmacist × DAO</p>
    </footer>
    </div>
    <div class="leaf-layer" id="leaf-layer"></div>
  </div>

  <script>
    (function () {
      const leafLayer = document.getElementById('leaf-layer');
      if (!leafLayer) return;
      for (let i = 0; i < 20; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.style.left = (Math.random() * 100) + 'vw';
        leaf.style.animationDelay = (Math.random() * 5) + 's';
        leaf.style.animationDuration = (8 + Math.random() * 6) + 's';
        leafLayer.appendChild(leaf);
      }
    })();
  </script>
</body>

</html>
