<!DOCTYPE html>
<html lang="ja">

<head>

    <link rel="stylesheet" href="../../style.css" />

    <style>
        .go-wrap { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .go-inner { background: rgba(255, 255, 255, .9); border: 1px solid rgba(0, 0, 0, .12); border-radius: 14px; padding: 28px 24px; max-width: 560px; }
        .go-inner p { margin: 10px 0; }
        .go-sub { font-size: .88rem; opacity: .75; }
    </style>
    <script src="../../assets/material-tracking.js" defer></script>
</head>

<body>
    <div class="forest-bg">
        <main class="page-content">
            <div class="page-sections">
                <section class="section container go-wrap">
                    <div class="go-inner">
                        <p>『ボアリング戦略』の続きを書いている場所へ移動しています…</p>
                        <p class="go-sub">自動で切り替わらない場合は、下のボタンを押してください。</p>

            <footer class="footer">

            </footer>
        </main>
    </div>

    <script>
        // 計測のためのワンクッション（/go/brain/ と同じ設計）。302だとHTMLが描画されず
        // Cloudflare Web Analytics が数えられないため、このページを1枚挟んで0.9秒後に転送する。
        // /go/book2/ ＝ 巻末の導線。ここのページビューが「本経由のSubstack登録導線」の分母。
        // 計測の発行は転送の直前（defer の material-tracking.js が受け手を登録した後）。/go/brain/ と同じ順
        setTimeout(function () {
            window.dispatchEvent(new CustomEvent('rondo-brain-outbound', { detail: 'book2-substack' }));
            window.location.replace('https://earthkey.substack.com/?utm_source=book2&utm_medium=epub');
        }, 900);
    </script>
</body>
